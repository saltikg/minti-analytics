version: 2

models:
  - name: fct_video_daily_metrics
    description: Daily performance metrics per video, per platform. One row per video per snapshot date.
    
    columns:
      - name: snapshot_date
        description: Date of the performance snapshot.
        tests:
          - not_null
      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null
      - name: channel_type
        description: Platform channel type (youtube, instagram, facebook).
        tests:
          - not_null
          - accepted_values:
              values: ['youtube','instagram','facebook']
      - name: video_id
        description: Platform-specific video identifier.
        tests:
          - not_null
          - relationships:
              to: ref('dim_generated_videos')
              field: generated_video_id 

      - name: impressions
        description: Total impressions for the video on this date.
      - name: views
        description: Total views for the video on this date.
      - name: comments
        description: Total comments for the video on this date.
      - name: likes
        description: Total likes for the video on this date.
      - name: shares
        description: Total shares for the video on this date.
      - name: reach
        description: Total unique accounts reached on this date.
      - name: saved
        description: Total saves for the video on this date.
      - name: stats_source
        description: Source system that provided the metrics.
      - name: primary_exposure
        description: Primary exposure metric for the platform.
      - name: engagement_count
        description: Total engagement actions (likes + comments + shares+saved).
      - name: engagement_rate
        description: Engagement rate calculated as engagement_count divided by primary_exposure (reach for Instagram, views for YouTube).
  - name: fct_video_daily_deltas
    description: Day-over-day metric changes per video and snapshot date.
    columns:
      - name: snapshot_date
        description: Snapshot date.
        tests:
          - not_null
      - name: channel_type
        description: Channel type such as youtube or instagram.
        tests:
          - not_null
      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null
      - name: video_id
        description: Platform video identifier.
        tests:
          - not_null
      - name: views
        description: Daily delta views.
      - name: likes
        description: Daily delta likes.
      - name: comments
        description: Daily delta comments.
      - name: shares
        description: Daily delta shares.
      - name: reach
        description: Daily delta reach.
      - name: saved
        description: Daily delta saved.

  - name: fct_channel_daily_growth
    description: Daily subscriber growth metrics per channel and platform. One row per channel per snapshot date.
    columns:
      - name: snapshot_date
        description: Date of the subscriber snapshot.
        tests:
          - not_null
      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null
      - name: channel_type
        description: Platform channel type (youtube, instagram, facebook).
        tests:
          - not_null
      - name: subscriber_count
        description: Total subscriber or follower count on this date.
      - name: subscriber_delta
        description: Day-over-day change in subscriber count.

  - name: fct_social_comments
    description: Unified comment feed across YouTube, Instagram, and Facebook platforms.
    columns:
      - name: comment_sk
        description: Surrogate key for the comment record.
        tests:
          - not_null
          - unique
      - name: brand_id
        description: Brand identifier.
      
      - name: platform
        description: Platform the comment originated from (youtube, instagram, facebook).
        tests:
          - not_null
          - accepted_values:
              values: ['youtube', 'instagram', 'facebook']
    
      - name: comment_id
        description: Unique comment identifier from the source platform.
        tests:
          - not_null
      - name: comment_video_id
        description: Video identifier the comment belongs to.
      - name: comment_text
        description: Raw comment text content.
      - name: comment_published_at
        description: Timestamp when the comment was published.
      - name: is_reply
        description: Boolean flag indicating if the comment is a reply.
      - name: like_count
        description: Number of likes on the comment.
      - name: moderation_flagged
        description: Boolean flag indicating if the comment was flagged for moderation.


  - name: dim_generated_videos
    description: Dimension table for AI-generated videos. Contains metadata, publish status, and platform identifiers for each generated video.
    columns:
      - name: generated_video_id
        description: Unique identifier for the generated video.
        tests:
          - not_null
          - unique


      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null
      - name: source_video_id
        description: Identifier of the original source video used for generation.
      - name: publish_status
        description: Current publish status of the generated video (e.g. published, draft, failed).
      - name: primary_publish_platform
        description: Primary platform the video was published to (youtube, instagram, facebook, tiktok).
      - name: youtube_video_id
        description: YouTube video identifier after publishing.
      - name: instagram_media_id
        description: Instagram media identifier after publishing.
      - name: facebook_video_id
        description: Facebook video identifier after publishing.
      - name: tiktok_video_id
        description: TikTok video identifier after publishing.
      - name: planned_publish_at
        description: Planned publish timestamp.
      - name: published_at
        description: Actual publish timestamp.
      - name: youtube_published_at
        description: Timestamp when published to YouTube.
      - name: instagram_published_at
        description: Timestamp when published to Instagram.
      - name: facebook_published_at
        description: Timestamp when published to Facebook.
      - name: tiktok_published_at
        description: Timestamp when published to TikTok.
      - name: generated_title
        description: AI-generated title for the video.
      - name: created_at
        description: Record creation timestamp.
      - name: updated_at
        description: Record last updated timestamp.

  - name: fct_video_performance_summary
    description: >
      One row per published YouTube video. Aggregates traffic source breakdown,
      retention metrics, and subscriber gains across the video's full history.
      Used for video performance analysis and content strategy dashboard.

    columns:
      - name: youtube_video_id
        description: YouTube video identifier. Primary key.
        tests:
          - not_null
          - unique

      - name: generated_title
        description: AI-generated title of the video.

      - name: effective_publish_at
        description: Publish timestamp (youtube_published_at coalesced with planned_publish_at).
        tests:
          - not_null

      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null

      - name: video_duration_sec
        description: Video duration in seconds, derived from raw_plan_entry_json (end - start).

      - name: total_views
        description: Total YouTube views across all traffic sources and all dates.

      - name: algorithm_views
        description: Views from feed_algorithm sources (SHORTS, NOTIFICATION, YT_OTHER_PAGE, RELATED_VIDEO).

      - name: search_views
        description: Views from organic search (YT_SEARCH).

      - name: external_views
        description: Views from external URLs (EXT_URL).

      - name: channel_views
        description: Views from channel page (YT_CHANNEL).

      - name: subscriber_views
        description: Views from subscribers (SUBSCRIBER).

      - name: other_views
        description: Views from uncategorized sources (NO_LINK_OTHER, PLAYLIST, SOUND_PAGE, HASHTAGS).

      - name: algorithm_pct
        description: Percentage of total views from algorithm-driven sources.

      - name: search_pct
        description: Percentage of total views from organic search.

      - name: subscriber_pct
        description: Percentage of total views from subscribers.

      - name: discovery_label
        description: Video discovery classification based on traffic mix.
        tests:
          - accepted_values:
              values: ['algorithm_driven', 'demand_driven', 'mixed']

      - name: avg_retention_pct
        description: >
          Average percentage of the video watched per view across all days.
          Values above 100 indicate looping behavior.

      - name: avg_duration_sec
        description: Average view duration in seconds across all days.

      - name: total_subs_gained
        description: Total subscribers gained attributed to this video.

      - name: ever_looped
        description: True if average_view_percentage exceeded 100 on any day (looping video).

      - name: days_with_data
        description: Number of days with retention data for this video.

      - name: retention_tier
        description: Retention quality tier based on avg_retention_pct.
        tests:
          - accepted_values:
              values: ['high', 'mid', 'low']

  - name: fct_video_lifecycle
    description: >
      One row per video per day since publish. Shows daily view counts
      alongside retention tier and discovery label for lifecycle analysis.
      Source: fct_video_daily_deltas joined with publish dates and performance summary.

    columns:
      - name: video_id
        description: YouTube video identifier.
        tests:
          - not_null

      - name: snapshot_date
        description: Date of the snapshot.
        tests:
          - not_null

      - name: days_since_publish
        description: Number of days elapsed since planned_publish_at. Day 0 = publish day.
        tests:
          - not_null

      - name: daily_views
        description: Incremental views on this day (from fct_video_daily_deltas).

      - name: publish_date
        description: Video publish date (from planned_publish_at).

      - name: generated_title
        description: AI-generated title of the video.

      - name: brand_id
        description: Brand identifier.
        tests:
          - not_null

      - name: avg_retention_pct
        description: Average retention percentage across the video's full history (from fct_video_performance_summary).

      - name: retention_tier
        description: Retention quality tier (high / mid / low).
        
      - name: discovery_label
        description: Traffic source classification (algorithm_driven / demand_driven / mixed).
        
      - name: video_total_views
        description: Total lifetime views for this video (from fct_video_performance_summary).



